<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meals">
<meta name="application-name" content="Meals">
<title>Meal Tracker</title>
<style id="page-style"></style>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f62'/%3E%3Ccircle cx='32' cy='34' r='16' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M14 14v14M10 14v8a4 4 0 0 0 8 0v-8M50 14c-4 2-5 8-5 12h5v20' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#22302c; --muted:#5f6d68; --line:#e4dfd5;
  --pri:#2f6f62; --pri-ink:#ffffff; --pri-soft:#e2efeb;
  --home:#2f6f62; --home-soft:#e2efeb; --din:#a3561c; --din-soft:#f7e8dc;
  --danger:#b3261e; --danger-soft:#fbe9e7;
  --tabh:66px; --safe-b:env(safe-area-inset-bottom,0px);
  --radius:16px;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.appbar{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.appbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.appbar h1{font-size:1.3rem;margin:0;flex:1}
.appbar .sub{color:var(--muted);font-size:.9rem}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(var(--tabh) + var(--safe-b) + 100px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.pad{padding:14px}
.lbl{font-size:.88rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.hint{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.muted{color:var(--muted)}
.field{display:block}
.input,input[type=date],input[type=text],input[type=number],input[type=url],input[type=email],input[type=password],textarea,select{width:100%;min-height:50px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:1rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
input[type=date]{min-width:0;max-width:100%;display:block}
textarea{min-height:80px;resize:vertical}
/* segmented */
.seg{display:flex;flex-wrap:wrap;background:#ece8df;border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1 1 0;min-width:70px;min-height:48px;border:0;border-radius:10px;background:transparent;font-size:1rem;font-weight:600;color:var(--muted);padding:6px 8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.src button.on.home{background:var(--home);color:#fff}
.seg.src button.on.dining{background:var(--din);color:#fff}
.seg.mini{padding:3px;border-radius:11px}
.seg.mini button{min-height:44px;min-width:64px;font-size:.95rem;padding:4px 10px;white-space:nowrap}
.ctrls .seg.mini{flex:1 1 210px}
@media (max-width:440px){.seg.grid4{display:grid;grid-template-columns:1fr 1fr}.seg.grid4 button{min-width:0}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:1rem}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{background:#fff;border-color:#e7b7b2;color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:8px 4px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn-row .btn{flex:1 1 140px}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:inline-grid;place-items:center;font-size:1.2rem;flex:none}
.iconbtn.danger{color:var(--danger);border-color:#ecc9c5}
/* log list */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:42px;font-weight:600;font-size:.95rem;white-space:nowrap}
.chip .n{display:inline-block;margin-left:6px;background:var(--pri);color:#fff;border-radius:999px;padding:0 7px;font-size:.8rem}
.search{position:relative;margin-bottom:10px}
.search input{padding-right:48px}
.search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:44px;height:44px;font-size:1.3rem;color:var(--muted)}
.cat-head{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#faf8f3;padding:12px 14px 12px 16px;min-height:66px;text-align:left;font-size:1.15rem;font-weight:700;cursor:pointer}
.cat-head:active{background:#f0ece2}
.cat-head .cat-name{flex:1;min-width:0}
.cat-head .cat-sub{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin-top:2px}
.cat-head .cat-sub.has{color:var(--pri)}
.cat.closed .cat-head{border-bottom:0}
.chev2{flex:none;width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--pri);transition:transform .18s}
.chev2 svg{width:24px;height:24px}
.cat-head[aria-expanded="true"] .chev2{transform:rotate(180deg);background:var(--pri);border-color:var(--pri);color:#fff}
.expand-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.expand-row .btn{min-height:50px;font-size:1rem}
.badge{background:var(--pri);color:#fff;border-radius:999px;min-width:28px;padding:2px 9px;font-size:.88rem;text-align:center}
.chev{display:inline-block;transition:transform .15s;font-size:1.4rem;color:var(--muted);transform:rotate(0deg);line-height:1}
.chev.open{transform:rotate(90deg)}
.item{border-top:1px solid var(--line)}
.item.on{background:#f4faf8}
.item-main{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:10px 16px;min-height:62px;text-align:left}
.check{width:36px;height:36px;flex:none;border-radius:10px;border:2.5px solid #b5ae9f;background:#fff;display:grid;place-items:center}
.item.on .check{background:var(--pri);border-color:var(--pri)}
.item .name{flex:1;font-size:1.08rem}
.item.on .name{font-weight:650}
.item .qtag{font-weight:700;color:var(--pri)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 16px 12px 66px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.step button{width:48px;height:46px;border:0;background:#fff;font-size:1.5rem;font-weight:600;color:var(--pri)}
.step .q{width:auto;min-width:54px;font-size:1.1rem;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.half{min-height:48px;min-width:66px;border-radius:12px;border:1.5px dashed var(--pri);background:#fff;color:var(--pri);font-weight:800;font-size:1.1rem;padding:0 12px}
.half.on{background:var(--pri);color:#fff;border-style:solid}
.flabel{display:block;font-size:.88rem;font-weight:700;color:var(--muted);margin:12px 0 4px}
.syncpill{border:0;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;background:#ece8df;color:var(--muted);min-height:34px;white-space:nowrap}
.syncpill.ok{background:var(--home-soft);color:var(--home)}
.syncpill.warn{background:#fff1d6;color:#8a5a00}
.syncpill.bad{background:var(--danger-soft);color:var(--danger)}
.cstatus{display:flex;gap:10px;align-items:flex-start;background:#faf8f3;border-radius:12px;padding:10px 12px}
.cstatus .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:#b5ae9f}
.cstatus .dot.ok{background:var(--home)} .cstatus .dot.warn{background:#d39b1c} .cstatus .dot.bad{background:var(--danger)}
.costline{width:100%;font-size:.95rem;color:var(--muted)}
.costline b{color:var(--ink)}
.add-row{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:none;color:var(--pri);font-weight:600;padding:14px 16px;min-height:52px;text-align:left}
.banner{background:#fff7e0;border:1px solid #efd99a;border-radius:12px;padding:8px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner span{flex:1}
/* save bar */
#savebar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b) + 8px);z-index:25;padding:10px 14px;background:linear-gradient(to top,rgba(246,244,239,1) 70%,rgba(246,244,239,0))}
#savebar[hidden]{display:none}
.savebar-in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.savebar-in .primary{flex:1;min-height:58px;font-size:1.08rem;box-shadow:0 4px 14px rgba(47,111,98,.3)}
.savebar-in .primary:disabled{background:#9db8b1;border-color:#9db8b1;box-shadow:none;opacity:1}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:calc(var(--safe-b) + 8px)}
/* hide hosting badges (e.g. Netlify) that float over the tab bar; harmless if absent */
[id*="netlify" i]:not(html):not(body),[class*="netlify" i]:not(html):not(body),iframe[src*="netlify" i],a[href*="netlify.com" i][style*="fixed"],netlify-badge{display:none!important;visibility:hidden!important;pointer-events:none!important}
.tabs-in{max-width:760px;margin:0 auto;display:flex}
.tabs button{flex:1;height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7b8783;font-size:.85rem;font-weight:600}
.tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--pri)}
.tabs button.on svg{stroke-width:2.4}
/* history */
.day{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px;font-size:1.05rem}
.day:first-child{margin-top:4px}
.day .d2{color:var(--muted);font-weight:500;font-size:.92rem;flex:1}
.day .tot{font-weight:700;color:var(--ink)}
.meal-card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;min-height:64px}
.mc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mc-top b{font-size:1.08rem}
.who{background:#efece5;border-radius:999px;padding:2px 10px;font-size:.88rem;color:var(--muted);font-weight:600}
.mc-top .tot{margin-left:auto;font-weight:700}
.mc-items{color:var(--ink);font-size:.98rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:700}
.tag.home{background:var(--home-soft);color:var(--home)}
.tag.dining{background:var(--din-soft);color:var(--din)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.2rem;margin:0 0 8px}
/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:1.5rem;font-weight:800}
.stat .k{font-size:.85rem;color:var(--muted);font-weight:600}
.bars{padding:6px 14px 12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;padding:7px 0}
.bar-row .bn{font-weight:600;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#eeeae2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar i.dining{background:var(--din)}
.bar-row .bv{font-weight:700;text-align:right;min-width:44px;font-size:.98rem}
.bar-row .bv small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.card h3{margin:0;padding:14px 14px 4px;font-size:1.05rem}
.range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.range label span{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.money-grid{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:8px 10px 14px}
.money-grid .v{font-size:1.25rem;font-weight:800}
.money-grid .k{font-size:.85rem;color:var(--muted);font-weight:600}
/* settings */
.set-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .grow{flex:1}
.set-title{font-weight:650}
.switch{width:62px;height:36px;border-radius:999px;border:0;background:#cfc9bc;position:relative;flex:none;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--pri)}
.switch.on span{left:29px}
.sec-title{font-size:1.1rem;margin:22px 4px 8px}
.sec-title:first-child{margin-top:4px}
.mitem{padding:10px 14px;border-top:1px solid var(--line)}
.mitem-top{display:flex;gap:8px;align-items:center}
.mitem-top input{flex:1}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.prices label span{display:block;font-size:.8rem;font-weight:700;margin-bottom:2px}
.prices label.home span{color:var(--home)}
.prices label.dining span{color:var(--din)}
.cat-tools{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#faf8f3;border-top:1px solid var(--line)}
.cat-tools input{flex:1}
/* modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,28,25,.45)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + var(--safe-b));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:20px}}
.sheet h2{margin:0 0 6px;font-size:1.25rem}
.sheet p{margin:0 0 12px;color:var(--muted)}
.sheet .input{margin:6px 0 4px}
.sheet-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sheet-btns .btn{width:100%}
.dl{margin:4px 0 0;padding:0;list-style:none}
.dl li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.dl .nm{flex:1}
.dl .cg{font-size:.82rem;color:var(--muted);display:block}
.notes{background:#faf8f3;border-radius:10px;padding:8px 12px;margin-top:8px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:#22302c;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.grid3{display:grid!important;grid-template-columns:repeat(3,1fr)}
.grid3 button{min-width:0;font-size:.95rem;padding:6px 4px}
.userbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;min-height:38px;font-weight:700;font-size:.9rem;max-width:130px}
.userbtn[hidden]{display:none}
.userbtn .av{width:28px;height:28px;font-size:.85rem}
.userbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-weight:800;flex:none}
.av.admin{background:var(--pri);color:#fff}
.role{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 8px;background:#efece5;color:var(--muted)}
.role.admin{background:var(--pri-soft);color:var(--pri)}
.role.stay{background:#e8f1fb;color:#2b5d8f}
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(24px + var(--safe-b))}
#lock[hidden]{display:none}
body.locked{overflow:hidden}
.lock-in{max-width:420px;margin:0 auto;text-align:center}
.lock-in .left{text-align:left}
.lock-brand{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--pri);font-weight:800;font-size:1.1rem;margin:6px 0 18px}
.lock-in h1{font-size:1.5rem;margin:8px 0 6px}
.lock-in p{color:var(--muted);margin:0 0 14px}
.lock-in .av{width:64px;height:64px;font-size:1.6rem}
.who-grid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.who-btn{display:flex;align-items:center;gap:16px;border:2px solid var(--line);background:#fff;border-radius:20px;padding:14px 18px;min-height:92px;font-size:1.6rem;font-weight:800;text-align:left;width:100%;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.who-btn:active{background:var(--pri-soft);border-color:var(--pri)}
.who-btn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.who-btn .av{width:62px;height:62px;font-size:1.6rem}
.who-btn .role{font-size:.8rem}
.who-btn .go{color:var(--pri);font-size:2rem;line-height:1}
.dots{display:flex;justify-content:center;gap:18px;margin:18px 0 6px}
.dots i{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--pri);display:block}
.dots i.on{background:var(--pri)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pin-err{min-height:26px;color:var(--danger);font-weight:700}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:340px;margin:8px auto 0}
.pinpad button{height:84px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:2.2rem;font-weight:700;width:84px;justify-self:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.pinpad button:active{background:var(--pri-soft)}
.pinpad button.fn{border-color:transparent;background:transparent;font-size:1.3rem;color:var(--muted)}
.pinpad span{display:block}
.warn-box{display:flex;gap:10px;align-items:flex-start;background:#fff4dc;border:1px solid #efd18f;color:#6b4a00;border-radius:12px;padding:10px 12px;margin:0 14px 14px;font-size:.95rem}
.warn-box b.ic{flex:none;width:22px;height:22px;border-radius:50%;background:#d39b1c;color:#fff;display:grid;place-items:center;font-size:.85rem}
.tbl-wrap{overflow-x:auto;padding:4px 8px 12px}
table.daily{width:100%;border-collapse:collapse;font-size:.88rem}
table.daily th,table.daily td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.daily th:first-child,table.daily td:first-child{text-align:left}
table.daily thead th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em}
table.daily tfoot th{border-bottom:0;border-top:2px solid var(--ink)}
.big-total{font-size:2.2rem;font-weight:800;text-align:center;padding:4px 14px 0}

<script>
(function(){
'use strict';
var KEY='mealTracker.v1', DRAFT_KEY='mealTracker.draft.v1';
var MEALS=['Breakfast','Lunch','Dinner','Snack','Other'];
var APP_VERSION='1.5.0';
var ALL='Both';
var SRC={home:'Home',dining:'Dining Room'};
var CHECK='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var STARTER=[
 ['Dairy',['Milk','Yogurt','Cheese','Cottage Cheese','Butter','Ice Cream']],
 ['Protein',['Eggs','Chicken','Fish','Beef','Pork','Turkey','Ham','Tuna','Beans','Peanut Butter']],
 ['Vegetables',['Broccoli','Salad','Carrots','Green Beans','Peas','Corn','Spinach','Tomato','Mixed Vegetables']],
 ['Fruit',['Banana','Apple','Orange','Berries','Grapes','Applesauce','Melon','Canned Fruit']],
 ['Grains/Starches',['Toast','Bread','Rice','Oatmeal','Cereal','Pasta','Potatoes','Crackers','Muffin','Pancakes']],
 ['Drinks',['Coffee','Tea','Juice','Water','Soda','Nutrition Shake']],
 ['Snacks/Desserts',['Cookies','Cake','Pudding','Jell-O','Chips','Pie']],
 ['Other',['Soup','Sandwich','Casserole','Pizza']],
 ['Household',['Paper Towels','Toilet Paper','Tissues','Dish Soap','Hand Soap','Laundry Detergent','Trash Bags','Batteries']]
];

function $(s){return document.querySelector(s);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function today(){return ymd(new Date());}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function round2(n){return Math.round(n*100)/100;}
function fmtQty(q){return String(round2(q));}
function hasHalf(q){return Math.abs(q-Math.floor(q)-0.5)<1e-9;}
function qtyNice(q){q=round2(q);if(hasHalf(q)){var w=Math.floor(q);return (w?w:'')+'½';}return String(q);}
function defaultQty(person){return person===ALL?Math.max(1,db.settings.people.length):1;}
function money(n){return (db.settings.currency||'$')+(isNum(n)?n:0).toFixed(2);}
function defaultMeal(){var d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h>=4&&h<10.5)return 'Breakfast'; if(h>=10.5&&h<14.5)return 'Lunch'; if(h>=14.5&&h<16.5)return 'Snack'; if(h>=16.5&&h<20.5)return 'Dinner'; return 'Snack';}
function prettyDate(s,long){
  var t=today(); if(!long){ if(s===t)return 'Today'; if(s===addDays(t,-1))return 'Yesterday'; }
  var d=parseYmd(s),o={weekday:'short',month:'short',day:'numeric'}; if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString(undefined,o);}
function personLabel(p){return p===ALL?(db.settings.people.length===2?'Both':'Everyone'):p;}
function parseNum(s){if(s==null)return null;s=String(s).replace(/[^0-9.,-]/g,'').replace(',','.');if(s==='')return null;var n=parseFloat(s);return isFinite(n)?n:null;}

/* ---------- data ---------- */
function starterCategories(){return STARTER.map(function(c){return {id:uid(),name:c[0],items:c[1].map(function(n){return {id:uid(),name:n,cost:{home:null,dining:null}};})};});}
function freshDB(){return {version:1,settings:{showCosts:false,people:['Mom','Dad'],currency:'$',weekStart:0,itemSort:'frequent',trackers:defaultTrackers(),showDaily:false,autoLow:true,autoLowDays:3},categories:starterCategories(),meals:[],profiles:[],flags:[],days:[],restocks:[]};}
function normalize(d){
  var f=freshDB(); d=(d&&typeof d==='object')?d:{};
  d.settings=Object.assign({},f.settings,d.settings||{});
  if(!Array.isArray(d.settings.people))d.settings.people=f.settings.people.slice();
  if(!Array.isArray(d.categories))d.categories=f.categories;
  d.categories.forEach(function(c){c.id=c.id||uid();c.name=String(c.name||'Category');c.items=Array.isArray(c.items)?c.items:[];
    if(typeof c.household!=='boolean')c.household=hhName(c.name);
    c.items.forEach(function(i){i.id=i.id||uid();i.name=String(i.name||'Item');i.cost=Object.assign({home:null,dining:null},i.cost||{});i.packSize=isNum(+i.packSize)&&i.packSize!==null&&i.packSize!==''&&+i.packSize>0?+i.packSize:null;i.unit=String(i.unit||'');});});
  if(!Array.isArray(d.profiles))d.profiles=[];
  d.profiles=d.profiles.filter(function(p){return p&&p.id&&p.salt&&p.pinHash;});
  d.profiles.forEach(function(p){p.name=String(p.name||'User');p.role=p.role==='admin'?'admin':'member';});
  if(!Array.isArray(d.meals))d.meals=[];
  if(!Array.isArray(d.flags))d.flags=[];
  d.flags=d.flags.filter(function(f){return f&&f.id&&f.itemId;});
  d.flags.forEach(function(f){f.level=f.level==='out'?'out':'low';f.auto=!!f.auto;});
  if(!Array.isArray(d.restocks))d.restocks=[];
  d.restocks=d.restocks.filter(function(r){return r&&r.id&&r.itemId;});
  d.restocks.forEach(function(r){r.qty=numOrNull(r.qty);r.cost=numOrNull(r.cost);r.unit=String(r.unit||'');r.autoFlagged=!!r.autoFlagged;r.at=isNum(+r.at)&&r.at!=null?+r.at:parseYmd(r.date||today()).getTime();r.date=r.date||ymd(new Date(r.at));});
  d.settings.showDaily=!!d.settings.showDaily;d.settings.autoLow=d.settings.autoLow!==false;d.settings.autoLowDays=isNum(+d.settings.autoLowDays)?Math.max(0,Math.round(+d.settings.autoLowDays)):3;
  d.settings.trackers=normTrackers(d.settings.trackers)||defaultTrackers();
  if(!Array.isArray(d.days))d.days=[];
  d.days=d.days.filter(function(x){return x&&/^\d{4}-\d{2}-\d{2}$/.test(String(x.date||x.id||''));}).map(function(x){var k=String(x.date||x.id);return {id:k,date:k,counts:objNum(x.counts),notes:objStr(x.notes),requests:String(x.requests||''),note:String(x.note||''),by:x.by||null,byName:x.byName||null,at:isNum(x.at)?x.at:null};});
  if(['frequent','az','manual'].indexOf(d.settings.itemSort)<0)d.settings.itemSort='frequent';
  d.meals.forEach(function(m){m.id=m.id||uid();m.items=Array.isArray(m.items)?m.items:[];m.person=m.person||ALL;

function pinKey(k){

  lockUI.err='';renderLock();
  if(lockUI.digits.length===4){var p=profileById(lockUI.pid);lockUI.busy=true;
    checkPin(p,lockUI.digits).then(function(ok){lockUI.busy=false;
      if(ok){signInAs(p);return;}
      lockUI.fails++;lockUI.digits='';lockUI.err='Wrong PIN. Try again.';
      if(lockUI.fails>=5){lockUI.until=Date.now()+30000;lockUI.fails=0;lockUI.err='Too many tries. Wait 30 seconds.';}
      renderLock();var d=$('#pin-dots');if(d)d.classList.add('shake');});}

/* recency-weighted use (last 90 days, half-life 30 days). With a meal type, items logged for that

   history still gets a full Frequent section). */
var FREQ_MIN_MEALS=5;
function freqScores(meal){var all={},per={},n=0,t=parseYmd(today()).getTime();
  db.meals.forEach(function(m){var age=(t-parseYmd(m.date).getTime())/864e5;if(age<0)age=0;if(age>90)return;

function usedSince(itemId,r){var rd=ymd(new Date(r.at)),q=0;
  db.meals.forEach(function(m){if(m.date<rd)return;if(m.date===rd&&(m.createdAt||0)<r.at)return;
    m.items.forEach(function(e){if(e.itemId===itemId)q+=e.qty;});});return q;}
function avgUse(itemId){var first=null,t=today();
  db.meals.forEach(function(m){if(m.items.some(function(e){return e.itemId===itemId;})&&(!first||m.date<first))first=m.date;});
  if(!first)return {avg:0,days:0};
  var since=Math.round((parseYmd(t)-parseYmd(first))/864e5)+1,span=Math.min(28,Math.max(7,since)),from=addDays(t,-(span-1)),q=0;
  db.meals.forEach(function(m){if(m.date<from||m.date>t)return;m.items.forEach(function(e){if(e.itemId===itemId)q+=e.qty;});});
  return {avg:q/span,days:span};}
function estimate(itemId){var x=findItem(itemId),r=lastRestock(itemId);if(!x||!r||!isNum(r.qty)||r.qty<=0)return null;
  var per=unitIsSingle(r.unit)?1:(isNum(x.item.packSize)&&x.item.packSize>0?x.item.packSize:null);
  var a=avgUse(itemId),E={r:r,avg:a.avg,span:a.days,needPack:per==null};
  if(per==null)return E;
  E.stock=r.qty*per;E.used=usedSince(itemId,r);E.left=Math.max(0,E.stock-E.used);
  if(a.avg>0){E.days=E.left/a.avg;E.date=addDays(today(),Math.floor(E.days));}
  return E;}

function computeSnapshot(S){var M={},catOrder={};db.categories.forEach(function(c,i){catOrder[c.name]=i;});
  mealsIn(S.from,S.to,S.person,S.logger).forEach(function(m){var seen={};
    m.items.forEach(function(e){var k=lineKey(e),r=M[k];if(!r)r=M[k]={key:k,name:lineName(e),cat:catOfLine(e),qty:0,times:0,home:0,dining:0,last:'',cost:0,unpriced:0};
      r.qty+=e.qty;r[e.source]+=e.qty;if(!seen[k]){r.times++;seen[k]=1;}if(m.date>r.last)r.last=m.date;
      var u=lineUnit(e);if(u==null)r.unpriced++;else r.cost+=u*e.qty;});});
  var rows=Object.keys(M).map(function(k){return M[k];}),groups={},names=[];
  rows.forEach(function(r){if(!groups[r.cat]){groups[r.cat]=[];names.push(r.cat);}groups[r.cat].push(r);});
  names.sort(function(a,b){return ((catOrder[a]==null?999:catOrder[a])-(catOrder[b]==null?999:catOrder[b]))||a.localeCompare(b);});
  var srt=ui.snapSort==='az'?function(a,b){return a.name.localeCompare(b.name);}:function(a,b){return b.qty-a.qty||b.times-a.times||a.name.localeCompare(b.name);};
  names.forEach(function(n){groups[n].sort(srt);});
  return {rows:rows,groups:groups,cats:names};}
function renderSnapshot(S){var costs=db.settings.showCosts,P=computeSnapshot(S),h='';
  var tq=0,tc=0;P.rows.forEach(function(r){tq+=r.qty;tc+=r.cost;});
  h+='<div class="print-only print-head"><h1>Items consumed</h1><p><b>'+esc(rangeLabel(S.from,S.to))+'</b> · Who ate: '+esc(S.person==='all'?'All':S.person)+' · Logged by: '+esc(loggerFilterLabel(S.logger))+' · Printed '+esc(new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}))+'</p></div>';
  h+='<div class="no-print">'+seg('snap-sort',[{v:'most',l:'Most used first'},{v:'az',l:'A–Z'}],ui.snapSort==='az'?'az':'most')+'</div>';
  h+='<div class="btn-row no-print" style="margin:12px 0 14px"><button class="btn" data-action="snap-print">Print / Save as PDF</button><button class="btn" data-action="snap-csv">Download list CSV</button></div>';
  h+='<div id="snap" data-from="'+S.from+'" data-to="'+S.to+'" data-items="'+P.rows.length+'" data-qty="'+round2(tq)+'" data-cost="'+(costs?tc.toFixed(2):'')+'">';
  h+='<p class="muted no-print" style="margin:0 4px 10px;font-weight:600">'+esc(rangeLabel(S.from,S.to))+' · '+P.rows.length+' different item'+(P.rows.length===1?'':'s')+'</p>';
  if(!P.rows.length)return h+'<div class="empty"><h2>Nothing logged in this period</h2><p>Try a different period or filter.</p></div></div>';
  P.cats.forEach(function(cn){var g=P.groups[cn],cq=0;g.forEach(function(r){cq+=r.qty;});
    h+='<section class="card snap-cat"><h3>'+esc(cn)+' <span class="muted">'+fmtQty(round2(cq))+'</span></h3>';
    h+=g.map(function(r){return '<div class="snap-row" data-name="'+esc(r.name)+'" data-qty="'+round2(r.qty)+'" data-times="'+r.times+'" data-home="'+round2(r.home)+'" data-dining="'+round2(r.dining)+'" data-last="'+r.last+'" data-cost="'+(costs?r.cost.toFixed(2):'')+'">'+
      '<div class="sn-top"><span class="sn-name">'+esc(r.name)+'</span><span class="sn-q">'+fmtQty(round2(r.qty))+'</span></div>'+
      '<div class="sn-meta">'+r.times+' time'+(r.times===1?'':'s')+(r.home?' · <span class="ci h"><i></i>Home '+fmtQty(round2(r.home))+'</span>':'')+(r.dining?' · <span class="ci d"><i></i>Dining '+fmtQty(round2(r.dining))+'</span>':'')+' · last '+esc(shortDate(r.last))+(costs?' · <b>'+money(r.cost)+'</b>'+(r.unpriced?' <small>(some unpriced)</small>':''):'')+'</div></div>';}).join('');
    h+='</section>';});
  h+='<table class="snap-table print-only"><thead><tr><th>Item</th><th>Category</th><th>Total qty</th><th>Times</th><th>Home</th><th>Dining</th><th>Last eaten</th>'+(costs?'<th>Cost</th>':'')+'</tr></thead><tbody>';
  P.cats.forEach(function(cn){P.groups[cn].forEach(function(r){h+='<tr><td>'+esc(r.name)+'</td><td>'+esc(cn)+'</td><td>'+fmtQty(round2(r.qty))+'</td><td>'+r.times+'</td><td>'+fmtQty(round2(r.home))+'</td><td>'+fmtQty(round2(r.dining))+'</td><td>'+esc(shortDate(r.last))+'</td>'+(costs?'<td>'+money(r.cost)+'</td>':'')+'</tr>';});});
  h+='</tbody><tfoot><tr><th>Total</th><th></th><th>'+fmtQty(round2(tq))+'</th><th></th><th></th><th></th><th></th>'+(costs?'<th>'+money(tc)+'</th>':'')+'</tr></tfoot></table>';
  return h+'</div>';}
function snapCSV(){var S=ui.sum,costs=db.settings.showCosts,P=computeSnapshot(S),out=[];
  out.push(['Items consumed',S.from+' to '+S.to,'Who ate: '+(S.person==='all'?'All':S.person),'Logged by: '+loggerFilterLabel(S.logger)]);
  out.push(['Category','Item','Total qty','Times eaten','Home qty','Dining Room qty','Last eaten'].concat(costs?['Cost']:[]));
  P.cats.forEach(function(cn){P.groups[cn].forEach(function(r){out.push([cn,r.name,round2(r.qty),r.times,round2(r.home),round2(r.dining),r.last].concat(costs?[r.cost.toFixed(2)]:[]));});});
  download('items-consumed-'+S.from+'_to_'+S.to+'.csv',out.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'),'text/csv');}

function mealSort(a,b){return MEAL_ORDER.indexOf(a.meal)-MEAL_ORDER.indexOf(b.meal)||(a.createdAt||0)-(b.createdAt||0);}
function srcCounts(m){var c={home:0,dining:0};m.items.forEach(function(e){if(!isHHLine(e))c[e.source]+=e.qty;});return c;}

  if(!db.meals.length)return '<div class="empty"><h2>No meals logged yet</h2><p>Meals you save on the Log tab will show up here.</p><button class="btn primary" data-action="tab" data-v="log">Log a meal</button></div>';

  var dates=Object.keys(by).sort().reverse(),shown=dates.slice(0,ui.histDays),h='',costs=db.settings.showCosts;

      var names=m.items.map(function(e){return e.name+(e.qty!==1?' ×'+qtyNice(e.qty):'');});

      h+='<button class="meal-card" data-action="open-meal" data-id="'+m.id+'"><div class="mc-top"><b>'+esc(mealLabel(m))+'</b>'+(m.meal===HH_MEAL?'':'<span class="who">'+esc(personLabel(m.person))+'</span>')+''+(t!=null?'<span class="tot">'+money(t)+'</span>':'')+'</div><div class="mc-items">'+esc(txt||'(no items)')+'</div><div class="tags">'+(c.home?'<span class="tag home">Home '+fmtQty(c.home)+'</span>':'')+(c.dining?'<span class="tag dining">Dining Room '+fmtQty(c.dining)+'</span>':'')+(hq?'<span class="tag hh">'+HH_ICON+' Household '+fmtQty(hq)+'</span>':'')+(m.notes?'<span class="tag" style="background:#efece5;color:var(--muted)">Note</span>':'')+'</div><div class="mc-by">Logged by <b>'+esc(loggerName(m))+'</b>'+(m.createdAt?' · '+esc(timeStr(m.createdAt,m.date!==ymd(new Date(m.createdAt)))):'')+(editorName(m)?' · edited by '+esc(editorName(m)):'')+'</div></button>';

  });

  return h;

function weekStart(dstr){var d=parseYmd(dstr),ws=db.settings.weekStart||0;var diff=(d.getDay()-ws+7)%7;d.setDate(d.getDate()-diff);return ymd(d);}
var PERIODS=[['today','Today'],['thisweek','This week'],['lastweek','Last week'],['last7','Last 7 days'],['thismonth','This month'],['lastmonth','Last month'],['last30','Last 30 days'],['thisyear','This year'],['custom','Custom']];
function presetRange(p){var t=today(),d=parseYmd(t),ws=weekStart(t);
  if(p==='today')return [t,t];
  if(p==='thisweek')return [ws,addDays(ws,6)];
  if(p==='lastweek')return [addDays(ws,-7),addDays(ws,-1)];
  if(p==='last7')return [addDays(t,-6),t];
  if(p==='thismonth')return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
  if(p==='lastmonth')return [ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];
  if(p==='last30')return [addDays(t,-29),t];

  return [ui.sum.from||t,ui.sum.to||t];}
function rangeLabel(a,b){var o={month:'short',day:'numeric',year:'numeric'},da=parseYmd(a),dbb=parseYmd(b);
  if(a===b)return da.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  return da.toLocaleDateString(undefined,da.getFullYear()===dbb.getFullYear()?{month:'short',day:'numeric'}:o)+' – '+dbb.toLocaleDateString(undefined,o);}
function shortDate(s){var d=parseYmd(s);return d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function loggerOptions(){var o=[{v:'all',l:'Anyone'}],seen={};

function computeReport(S){

function netErr(e){return e&&(e.name==='TypeError'||e.name==='AbortError');}
function authCall(path,body,token){
  var h={'apikey':cloud.key,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  return fetch(baseUrl()+'/auth/v1/'+path,{method:'POST',headers:h,body:JSON.stringify(body||{})}).then(function(r){
    return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{};}catch(e){}
      if(!r.ok){var e=new Error(j.msg||j.error_description||j.message||j.error||('Error '+r.status));e.status=r.status;throw e;}
      return j;});});}
function setSession(j){cloud.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}};saveCloud();}
var refreshing=null;
function getToken(force){
  var s=cloud.session;if(!s){var e=new Error('Not signed in');e.signedOut=true;return Promise.reject(e);}
  if(!force&&s.expires_at-90>Date.now()/1000)return Promise.resolve(s.access_token);
  if(refreshing)return refreshing;
  refreshing=authCall('token?grant_type=refresh_token',{refresh_token:s.refresh_token}).then(function(j){setSession(j);return j.access_token;},function(e){
    if(e.status>=400&&e.status<500){var em=cloud.session&&cloud.session.user&&cloud.session.user.email;cloud.session=null;cloud.lastEmail=em;saveCloud();e.signedOut=true;}throw e;
  }).finally(function(){refreshing=null;});
  return refreshing;}
function api(method,path,body,headers,retried){
  return getToken(!!retried).then(function(tok){
    var h=Object.assign({'apikey':cloud.key,'Authorization':'Bearer '+tok,'Content-Type':'application/json'},headers||{});
    return fetch(baseUrl()+'/rest/v1/'+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  }).then(function(r){
    if(r.status===401&&!retried)return api(method,path,body,headers,true);
    return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){var e=new Error((j&&(j.message||j.msg))||('Database error '+r.status));e.status=r.status;e.code=j&&j.code;throw e;}
      return j;});});}
function getAll(path){var out=[];
  function page(off){return api('GET',path+'&limit=1000&offset='+off).then(function(rows){rows=rows||[];out=out.concat(rows);return rows.length<1000?out:page(off+1000);});}
  return page(0);}
function inList(ids){return encodeURIComponent('('+ids.map(function(i){return '"'+String(i).replace(/["\\]/g,'')+'"';}).join(',')+')');}

/* push local changes (diff against last-synced copy) */
function push(hh){
  var cur=flatten(db),keys=dirtyKeys(cur);if(!keys.length)return Promise.resolve(0);
  var ups={},dels={};
  keys.forEach(function(k){var t=k.slice(0,k.indexOf(':'));if(cur[k])(ups[t]=ups[t]||[]).push(k);else if(t!=='settings')(dels[t]=dels[t]||[]).push(k);});
  var steps=[];
  ['settings','profiles','categories','foods','flags','days','restocks','meals'].forEach(function(t){
    var ks=ups[t]||[];for(var i=0;i<ks.length;i+=200)(function(chunk){steps.push(function(){
      var rows=chunk.map(function(k){var r=Object.assign({household_id:hh},cur[k]);if(t!=='settings')r.deleted=false;return r;});
      return api('POST',TABLES[t]+'?on_conflict='+(t==='settings'?'household_id':'household_id,id'),rows,{'Prefer':'resolution=merge-duplicates,return=minimal'})
        .then(function(){chunk.forEach(function(k){shadow.recs[k]=stable(cur[k]);});saveShadow();});});})(ks.slice(i,i+200));
    var ds=dels[t]||[];for(var j=0;j<ds.length;j+=100)(function(chunk){steps.push(function(){
      var ids=chunk.map(function(k){return k.slice(k.indexOf(':')+1);});
      return api('PATCH',TABLES[t]+'?household_id=eq.'+hh+'&id=in.'+inList(ids),{deleted:true},{'Prefer':'return=minimal'})
        .then(function(){chunk.forEach(function(k){delete shadow.recs[k];});saveShadow();});});})(ds.slice(j,j+100));
  });
  return steps.reduce(function(p,f){return p.then(f);},Promise.resolve()).then(function(){return keys.length;});}

/* fetch server state; full=true also drops local rows the server no longer has */
function fetchServer(hh,full){
  var res={};
  var mq='meals?household_id=eq.'+hh+'&select=*&order=updated_at.asc,id.asc';
  if(!full&&cloud.cursor)mq+='&updated_at=gte.'+encodeURIComponent(new Date(Date.parse(cloud.cursor)-120000).toISOString());else mq+='&deleted=is.false';
  return api('GET','household_settings?household_id=eq.'+hh+'&select=*').then(function(r){res.settings=r||[];
    return getAll('categories?household_id=eq.'+hh+'&deleted=is.false&select=id,name,sort_order,household&order=id.asc');}).then(function(r){res.categories=r;
    return getAll('foods?household_id=eq.'+hh+'&deleted=is.false&select=id,category_id,name,price_home,price_dining,sort_order,pack_size,restock_unit&order=id.asc');}).then(function(r){res.foods=r;
    return getAll('profiles?household_id=eq.'+hh+'&deleted=is.false&select=id,name,role,pin_salt,pin_hash,created_ms&order=id.asc');}).then(function(r){res.profiles=r;
    return getAll('restock_flags?household_id=eq.'+hh+'&deleted=is.false&select=id,item_id,item_name,category,note,flagged_by,flagged_by_name,flagged_ms,level,auto&order=id.asc');}).then(function(r){res.flags=r;
    return getAll('restock_events?household_id=eq.'+hh+'&deleted=is.false&select=id,item_id,item_name,date,at_ms,qty,unit,cost,by_id,by_name,auto_flagged&order=id.asc');}).then(function(r){res.restocks=r;
    return getAll('daily_logs?household_id=eq.'+hh+'&deleted=is.false&select=id,date,counts,notes,requests,day_note,updated_by_name,edited_by,edited_ms&order=id.asc');}).then(function(r){res.days=r;
    return getAll(mq);}).then(function(r){res.meals=r;res.full=full||!cloud.cursor;return res;});}
function mergeServer(res){
  var cur=flatten(db),recs=shadow.recs,changed=false,serverKeys={};
  function dirty(k){return (cur[k]?stable(cur[k]):null)!==(recs[k]||null);}
  function apply(k,rec){if(dirty(k))return;var sv=rec?stable(rec):null;
    if((cur[k]?stable(cur[k]):null)===sv){if(sv)recs[k]=sv;else delete recs[k];return;}
    changed=true;if(rec){cur[k]=rec;recs[k]=sv;}else{delete cur[k];delete recs[k];}}
  if(res.settings[0])apply('settings:main',rowToRec('settings',res.settings[0]));
  res.categories.forEach(function(r){serverKeys['categories:'+r.id]=1;apply('categories:'+r.id,rowToRec('categories',r));});
  res.foods.forEach(function(r){serverKeys['foods:'+r.id]=1;apply('foods:'+r.id,rowToRec('foods',r));});
  res.profiles.forEach(function(r){serverKeys['profiles:'+r.id]=1;apply('profiles:'+r.id,rowToRec('profiles',r));});
  res.flags.forEach(function(r){serverKeys['flags:'+r.id]=1;apply('flags:'+r.id,rowToRec('flags',r));});
  (res.days||[]).forEach(function(r){serverKeys['days:'+r.id]=1;apply('days:'+r.id,rowToRec('days',r));});
  (res.restocks||[]).forEach(function(r){serverKeys['restocks:'+r.id]=1;apply('restocks:'+r.id,rowToRec('restocks',r));});
  res.meals.forEach(function(r){serverKeys['meals:'+r.id]=1;apply('meals:'+r.id,r.deleted?null:rowToRec('meals',r));
    if(!cloud.cursor||Date.parse(r.updated_at)>Date.parse(cloud.cursor))cloud.cursor=r.updated_at;});
  Object.keys(cur).forEach(function(k){var t=k.slice(0,k.indexOf(':'));
    if((t==='categories'||t==='foods'||t==='profiles'||t==='flags'||t==='days'||t==='restocks'||(t==='meals'&&res.full))&&!serverKeys[k])apply(k,null);});
  if(changed){db=unflatten(cur);saveLocal();reindex();setTimeout(autoFlag,0);}
  saveShadow();saveCloud();
  return changed;}

function linkHousehold(hh){
  return fetchServer(hh,true).then(function(res){
    var empty=!res.settings.length&&!res.categories.length&&!res.foods.length&&!res.meals.length&&!res.profiles.length&&!res.flags.length&&!res.days.length&&!res.restocks.length;
    cloud.cursor=null;
    if(empty){cloud.awaitingUpload=true;shadow={hh:hh,recs:{}};saveShadow();saveCloud();return 'empty';}
    if(looksUsed(db))saveJSON(STASH_KEY,{savedAt:Date.now(),db:db});
    var recs={},sh={};
    if(res.settings[0])recs['settings:main']=rowToRec('settings',res.settings[0]);
    res.categories.forEach(function(r){recs['categories:'+r.id]=rowToRec('categories',r);});
    res.foods.forEach(function(r){recs['foods:'+r.id]=rowToRec('foods',r);});
    res.profiles.forEach(function(r){recs['profiles:'+r.id]=rowToRec('profiles',r);});
    res.flags.forEach(function(r){recs['flags:'+r.id]=rowToRec('flags',r);});
    res.meals.forEach(function(r){recs['meals:'+r.id]=rowToRec('meals',r);if(!cloud.cursor||Date.parse(r.updated_at)>Date.parse(cloud.cursor))cloud.cursor=r.updated_at;});
    Object.keys(recs).forEach(function(k){sh[k]=stable(recs[k]);});
    db=unflatten(recs);saveLocal();reindex();
    shadow={hh:hh,recs:sh};saveShadow();cloud.awaitingUpload=false;saveCloud();
    return 'loaded';});}

function doSync(){
  if(!signedIn()){setSync(cloudReady()?'signedout':'');return Promise.resolve();}
  if(navigator.onLine===false){setSync('offline');return Promise.resolve();}
  setSync('syncing');
  var linked=null,wasAwaiting=!!cloud.awaitingUpload;
  return Promise.resolve().then(function(){
    if(cloud.householdId)return cloud.householdId;
    return api('POST','rpc/my_household',{p_name:'Our household'}).then(function(id){cloud.householdId=id;saveCloud();return id;});
  }).then(function(hh){
    // also re-check while waiting for the first upload: another device may have uploaded since
    if(!shadow||shadow.hh!==hh||cloud.awaitingUpload)return linkHousehold(hh).then(function(r){if(!(r==='empty'&&wasAwaiting))linked=r;return hh;});
    return hh;
  }).then(function(hh){
    if(cloud.awaitingUpload)return 'awaiting';
    return push(hh).then(function(){return fetchServer(hh,false);}).then(function(res){return mergeServer(res);});
  }).then(function(r){
    if(r==='awaiting'){setSync('awaiting');}
    else{cloud.lastSync=Date.now();saveCloud();setSync(pendingCount()?'offline':'ok');}
    if(linked==='loaded'||r===true)softRender();
    if(linked)afterLink(linked);
  }).catch(function(e){
    console.warn('sync failed',e);
    if(e.signedOut)setSync('signedout');
    else if(netErr(e))setSync('offline');
    else if(e.status===404||e.code==='PGRST202'||e.code==='PGRST205'||e.code==='42P01'||e.code==='PGRST204'||e.code==='42703')setSync('error','The online database needs the latest setup. Run the newest supabase-setup.sql in the Supabase SQL editor (see SETUP.md), then tap Sync now.');
    else setSync('error',e.message);
  });}
function syncNow(){
  if(sync.queued)return sync.queued;
  sync.queued=(sync.running||Promise.resolve()).then(function(){sync.queued=null;sync.running=doSync().finally(function(){sync.running=null;});return sync.running;});
  return sync.queued;}
function scheduleSync(ms){if(!signedIn())return;clearTimeout(sync.timer);sync.timer=setTimeout(syncNow,ms==null?1500:ms);}
function softRender(){var a=document.activeElement;
  if(modalResolve||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='file')){sync.renderPending=true;return;}
  sync.renderPending=false;render();}
function afterLink(kind){
  if(kind==='empty'&&!db.profiles.length){lockUI.mode='setup';render();
    modal({title:'Online household is empty',message:'Create the first admin on this device. Then go to Settings › Online database and tap “Upload this device\'s existing data” to start syncing.'});}
  else if(kind==='empty'){
    modal({title:'Online database is empty',message:'Upload this device\'s item list, settings and '+db.meals.length+' logged meal'+(db.meals.length===1?'':'s')+' so they are saved online?',
      buttons:[{label:'Upload now',value:'up',style:'primary'},{label:'Later',value:'no',style:'ghost'}]}).then(function(r){if(r.button==='up')uploadLocal();});
  }else{var st=loadJSON(STASH_KEY,null);
    if(st&&st.db&&st.db.meals&&st.db.meals.length){
      modal({title:'Loaded the online data',message:'This device also had '+st.db.meals.length+' meal'+(st.db.meals.length===1?'':'s')+' from before you connected. Add them to the online database?',
        buttons:[{label:'Add them now',value:'up',style:'primary'},{label:'Later',value:'no',style:'ghost'}]}).then(function(r){if(r.button==='up')uploadLocal();});
    }else toast('Loaded data from the online database');}}

/* one-time migration of this device's data */
function mergeStash(old){
  old=normalize(JSON.parse(JSON.stringify(old)));
  var key=function(s){return String(s).trim().toLowerCase();},idMap={},allIds={};
  db.categories.forEach(function(c){allIds[c.id]=1;c.items.forEach(function(i){allIds[i.id]=1;});});
  old.categories.forEach(function(oc){
    var c=db.categories.filter(function(x){return key(x.name)===key(oc.name);})[0];
    if(!c){c={id:allIds[oc.id]?uid():oc.id,name:oc.name,items:[]};allIds[c.id]=1;db.categories.push(c);}
    oc.items.forEach(function(oi){
      var f=c.items.filter(function(x){return key(x.name)===key(oi.name);})[0];
      if(!f){f={id:allIds[oi.id]?uid():oi.id,name:oi.name,cost:{home:oi.cost.home,dining:oi.cost.dining}};allIds[f.id]=1;c.items.push(f);}
      else{if(!isNum(f.cost.home)&&isNum(oi.cost.home))f.cost.home=oi.cost.home;if(!isNum(f.cost.dining)&&isNum(oi.cost.dining))f.cost.dining=oi.cost.dining;}
      idMap[oi.id]=f.id;});});
  var have={},added=0;db.meals.forEach(function(m){have[m.id]=1;});
  old.meals.forEach(function(m){if(have[m.id])return;m.items.forEach(function(e){if(e.itemId&&idMap[e.itemId])e.itemId=idMap[e.itemId];});db.meals.push(m);added++;});
  old.settings.people.forEach(function(p){if(db.settings.people.indexOf(p)<0)db.settings.people.push(p);});
  reindex();return added;}
function uploadLocal(){
  if(!signedIn()){toast('Please sign in first');return Promise.resolve();}
  var hh=cloud.householdId;
  if(cloud.awaitingUpload){
    setSync('syncing');
    return Promise.all([api('GET','meals?household_id=eq.'+hh+'&select=id&limit=1'),api('GET','categories?household_id=eq.'+hh+'&select=id&limit=1')]).then(function(r){
      if(r[0].length||r[1].length){cloud.awaitingUpload=false;saveCloud();shadow=null;saveShadow();
        return syncNow().then(function(){toast('Someone already added data online; it was loaded here.');});}
      cloud.awaitingUpload=false;saveCloud();shadow={hh:hh,recs:{}};saveShadow();
      return syncNow().then(function(){if(sync.state==='ok')toast('Uploaded '+db.meals.length+' meals and your item list ✓');render();});
    }).catch(function(e){setSync(netErr(e)?'offline':'error',e.message);toast('Upload failed: '+e.message);});}
  var st=loadJSON(STASH_KEY,null);
  if(!st||!st.db){toast('Nothing to upload. This device is already in sync.');return Promise.resolve();}
  var n=mergeStash(st.db);saveJSON(STASH_KEY,null);save();render();
  return syncNow().then(function(){toast(sync.state==='ok'?'Added '+n+' meal'+(n===1?'':'s')+' to the online database ✓':'Saved here; will upload when online');render();});}

/* status UI */
var SYNC_TXT={ok:['ok','✓ Synced'],syncing:['','Syncing…'],offline:['warn','Offline'],awaiting:['warn','Upload needed'],error:['bad','Sync problem'],signedout:['warn','Not signed in']};
function setSync(state,msg){sync.state=state;sync.msg=msg||'';updateSyncUI();}
function updateSyncUI(){
  var pill=$('#syncpill'),st=sync.state||(cloudReady()?'signedout':'');
  if(!cloudReady()||!st){pill.hidden=true;}else{var t=SYNC_TXT[st]||['',''],n=pendingCount();
    pill.hidden=false;pill.className='syncpill '+t[0];pill.textContent=t[1]+(st==='offline'&&n?' · '+n+' waiting':'');}
  var cs=$('#cloud-status');if(cs)cs.innerHTML=cloudStatusHTML();
  var af=$('#appfoot');if(af)af.innerHTML=footHTML();
  renderLowPill();
  var cu=$('#cloud-upload');if(cu)cu.innerHTML=uploadHTML();}
function footHTML(){var t=signedIn()?'synced with your online database · works offline too':cloudReady()?'online database connected · not signed in':'works offline · no account needed';
  return '<span>Meal Tracker · '+t+'</span><span class="ver">v'+APP_VERSION+'</span>';}
function cloudStatusHTML(){
  var st=sync.state,n=pendingCount(),cls='',txt;
  if(st==='syncing'){txt='Syncing…';}
  else if(st==='offline'){cls='warn';txt=n?'No connection. '+n+' change'+(n===1?' is':'s are')+' saved on this device and will be sent automatically when you are back online.':'No connection right now. Everything is saved on this device.';}
  else if(st==='awaiting'&&!db.profiles.length){cls='warn';txt='Connected. The online household has no data yet. If another device is uploading, its people will appear here in a few seconds (checking automatically).';}
  else if(st==='awaiting'){cls='warn';txt='The online database is empty. Tap “Upload this device\'s data” below to start syncing.';}
  else if(st==='error'){cls='bad';txt='Could not sync: '+esc(sync.msg||'unknown error');}
  else if(st==='signedout'){cls='warn';txt='Signed out. Please sign in again.';}
  else if(st==='ok'){cls='ok';txt='All changes are saved online.';}
  else txt='Waiting to sync…';
  var last=cloud.lastSync?'<div class="muted" style="font-size:.88rem">Last synced '+new Date(cloud.lastSync).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</div>':'';
  return '<div class="cstatus"><span class="dot '+cls+'"></span><div>'+txt+last+'</div></div>';}
function uploadHTML(){
  if(cloud.awaitingUpload)return '<button class="btn primary block" data-action="cloud-upload">Upload this device\'s existing data to the database</button><p class="hint">Sends the item list, prices, settings and '+db.meals.length+' logged meal'+(db.meals.length===1?'':'s')+'. Do this once, from the device that has your data.</p>';
  var st=loadJSON(STASH_KEY,null),n=st&&st.db&&st.db.meals?st.db.meals.length:0;
  if(st&&st.db)return '<button class="btn primary block" data-action="cloud-upload">Upload this device\'s existing data to the database</button><p class="hint">This device had '+n+' meal'+(n===1?'':'s')+' (and its item list) from before you connected. They will be added to what is already online; nothing online is removed.</p>';
  return '<button class="btn block" disabled>Upload this device\'s existing data to the database</button><p class="hint">Nothing to upload. This device\'s data is already in the online database.</p>';}

function afterSignIn(j){setSession(j);cloud.householdId=null;saveCloud();render();toast('Signed in');return syncNow();}
function cloudAllowed(){if(isAdmin()||!db.profiles.length)return true;toast('Only an admin can change the online database');return false;}
var cloudActions={
  'goto-cloud':function(){if(lockNeeded())return;ui.tab='settings';render();var e=document.getElementById('cloud-sec');if(e)e.scrollIntoView({block:'start'});window.scrollBy(0,-70);},
  'cloud-connect':function(el){if(!cloudAllowed())return;

    el.disabled=true;el.textContent='Checking…';
    fetch(url+'/auth/v1/settings',{headers:{apikey:key}}).then(function(r){
      if(r.status===401||r.status===403)throw new Error('The key was not accepted. Copy the anon / publishable key again.');
      if(!r.ok)throw new Error('That address did not answer like a Supabase project (error '+r.status+'). Check the Project URL.');

    if(wasEdit){ui.tab='history';}render();window.scrollTo(0,0);toast(msg);};

  if(hhE.length){db.meals.push(hhRec(hhE));entries=foodE;}
  var hhMsg=hhE.length?' + Household':'';
  var rec={id:uid(),date:draft.date,meal:draft.meal,person:draft.person,notes:draft.notes||'',items:entries,createdAt:now,updatedAt:now,enteredBy:me?me.id:null,enteredByName:me?me.name:null};
  var dup=db.meals.find(function(m){return m.date===rec.date&&m.meal===rec.meal&&m.person===rec.person;});

    if(!nn||nn===ALL||(db.settings.people.indexOf(nn)>=0&&nn!==old)){t.value=old;toast('Please use a different name');return;}
    db.settings.people[i]=nn;db.meals.forEach(function(m){if(m.person===old)m.person=nn;});db.days.forEach(function(x){['counts','notes'].forEach(function(f){Object.keys(x[f]).forEach(function(kk){var j=kk.indexOf('|');if(j>0&&kk.slice(j+1)===old){x[f][kk.slice(0,j)+'|'+nn]=x[f][kk];delete x[f][kk];}});});});if(draft.person===old){draft.person=nn;saveDraft();}save();toast('Saved');}
  else if(a==='currency'){db.settings.currency=v.trim()||'$';save();toast('Saved');}
  else if(a==='rename-cat'){var c=catById(t.dataset.id);if(!c)return;if(!v.trim()){t.value=c.name;return;}c.name=v.trim();save();render();toast('Saved');}
  else if(a==='rename-item'){var f=findItem(t.dataset.id);if(!f)return;if(!v.trim()){t.value=f.item.name;return;}f.item.name=v.trim();save();toast('Saved');}
  else if(a==='price'){var g=findItem(t.dataset.id);if(!g)return;var n=parseNum(v);g.item.cost[t.dataset.src]=n;t.value=n==null?'':n.toFixed(2);save();toast('Price saved');}
});
window.addEventListener('storage',function(e){if(e.key===KEY){db=load();render();}else if(e.key===DEV_KEY){dev=loadJSON(DEV_KEY,{})||{};render();}else if(e.key===SHADOW_KEY){shadow=loadJSON(SHADOW_KEY,null);}else if(e.key===CLOUD_KEY){cloud=loadJSON(CLOUD_KEY,{})||{};updateSyncUI();}});

if(signedIn())sync.state='syncing';else if(cloudReady())sync.state='signedout';
if(dev.rememberCats&&dev.catOpen)ui.open=dev.catOpen;
/* Home-screen app support. Works only when the site also has manifest.webmanifest + sw.js
   next to index.html (the files in the site/ folder). If only index.html is hosted, this quietly does nothing. */
(function(){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  fetch('manifest.webmanifest',{cache:'no-store'}).then(function(r){
    if(!r.ok||/html/i.test(r.headers.get('content-type')||''))return;
    var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
    if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(function(){});
  }).catch(function(){});
})();
checkAutoLock();
render();setTimeout(function(){if(!lockNeeded())autoFlag();},400);
if(signedIn())syncNow();
if(restoredDraft)setTimeout(function(){toast('Restored your unsaved meal');},300);
window.__mealTracker={get db(){return db;},get draft(){return draft;},get cloud(){return cloud;},get sync(){return sync;},syncNow:syncNow,pendingCount:pendingCount,get dev(){return dev;},checkAutoLock:checkAutoLock,preparePrint:preparePrint,freqScores:freqScores,computeSnapshot:computeSnapshot,sha256hex:sha256hex,hashPin:hashPin,computeReport:computeReport};
})();
